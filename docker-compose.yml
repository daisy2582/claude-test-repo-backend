services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vegora_social
    # DB port NOT exposed to host - only accessible by api container internally
    # Uncomment below if you need direct host access to PostgreSQL:
    # ports:
    #   - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "9876:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vegora_social
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
      CORS_ORIGINS: "*"
      FRONTEND_DIR: /app/frontend
    volumes:
      - uploads_data:/app/uploads
      - ../claude-test-repo:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    command: python seed.py
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vegora_social
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

volumes:
  postgres_data:
  uploads_data:
